         ничему не мешает. Только ES5 -->
    <script>
      (function () {
        var stop = function (e) {
          e.preventDefault();
        };
        document.addEventListener('contextmenu', stop);
        document.addEventListener('gesturestart', stop);
        document.addEventListener('dblclick', stop);
        document.addEventListener('selectstart', function (e) {
          var tag = e.target && e.target.tagName;
          if (tag !== 'INPUT' && tag !== 'TEXTAREA') e.preventDefault(); // в поле клички выделение нужно
        });
      })();
    </script>

    <div id="boot">

    <div id="game"></div>
    <!-- Старый браузер: игра не запустится, говорим об этом (аудит YA-06). Два случая, показ один. Браузер без ES-модулей
         (скрипт с атрибутом nomodule ниже) и браузер с модулями, но без ES2020 (iOS 12–13.3, Chrome до 80): сборка
         использует ?. и ??, модуль не разбирается, и без этой проверки «Загрузка…» висела бы вечно. Проверка — сам синтаксис
         в отдельном скрипте: старый браузер его не разберёт, и флага __es2020 не будет. Без eval и new Function (площадка
         может запретить их политикой CSP — тогда проверка молча выключилась бы) и без таймеров: на медленной сети загрузка
         долгая, но законная. Первый скрипт — ES2020, остальные — только ES5 -->
    <script>
      window.__es2020 = (function () {
        var o = { a: { b: 1 } };
        return o?.a?.b ?? 0;
      })() === 1;
    </script>
    <script>
      (function () {
        var shown = false;
        window.__oldBrowser = function () {
          if (shown) return;
          shown = true;
          var boot = document.getElementById('boot');
          if (boot) boot.parentNode.removeChild(boot);
          var note = document.createElement('div');
          note.style.cssText =
            'display:flex;align-items:center;justify-content:center;height:100%;padding:24px;box-sizing:border-box;' +
            'text-align:center;font:22px system-ui,sans-serif;color:#4a3428';
          note.appendChild(document.createTextNode('Обновите браузер, чтобы играть'));
          document.getElementById('game').appendChild(note);
        };
        if (!window.__es2020) window.__oldBrowser();
      })();
    </script>
    <script nomodule>
      window.__oldBrowser();
    </script>
